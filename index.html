<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Finder</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <header>
        <h1>Job Finder</h1>
        <p>FInd job opportunities that match your skills and interests.</p>
       </header>
       <main>
        <section>
            <h2>Search for Jobs</h2>
            <form id="search-form">
                <label for="job-search">Job title</label>
                <input type="text" id="job-search" placeholder="e.g. Software Engineer">

                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g. Kigali">

                <button type="submit">Search Jobs</button>
            </form>
        </section>
        <section>
            <h2>Job Results</h2>
            <div id="job-results"></div>
        </section>
       </main>
       <script src="script.js"></script>
    </body>
</html>
